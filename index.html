<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة المهام — قسم المشتريات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ================= TITLE BLOCK — design system =================
   ink / steel / paper drawn from engineering drawing sheets.
   Readex Pro speaks Arabic and Latin in one voice; Plex Mono is
   the register face for sheet numbers, dates and counts.        */
:root{
  --ink:#101720; --ink-2:#1B2734; --ink-3:#2A3947;
  --paper:#E9EDF1; --card:#FFFFFF; --wash:#F5F7F9;
  --line:#D3DBE3; --line-2:#E6EBF0; --muted:#61748A; --text:#131C25;
  --brand:#C8102E; --brand-dark:#9E0B23; --steel:#33566B;
  --s-not:#7C8FA3; --s-prog:#B5730A; --s-done:#177A4C; --s-late:#C8102E; --s-hold:#69588F;
  --p1:#C8102E; --p2:#CE6A08; --p3:#33566B; --p4:#3F7346; --p5:#7C8FA3;
  --font:'Readex Pro',system-ui,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px; --r-s:7px;
  --sh-1:0 1px 2px rgba(16,23,32,.05);
  --sh-2:0 1px 2px rgba(16,23,32,.05),0 6px 18px -6px rgba(16,23,32,.14);
  --sh-3:0 24px 60px -18px rgba(16,23,32,.4);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--text);
  font-family:var(--font); font-size:14px; line-height:1.6; font-weight:400;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--steel)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:4px}
::selection{background:rgba(200,16,46,.16)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* ---------------- LOGIN ---------------- */
#login{min-height:100dvh;display:grid;grid-template-columns:1.08fr .92fr}
.lg-brand{
  background:var(--ink);color:#fff;padding:52px 48px;display:flex;
  flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
/* drawing-sheet grid: fine 8mm squares with a heavier 40mm ruling over it */
.lg-brand::before{
  content:"";position:absolute;inset:-2px;
  background-image:
    linear-gradient(rgba(255,255,255,.30) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.30) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);
  background-size:150px 150px,150px 150px,30px 30px,30px 30px;
  opacity:.5;
  mask-image:radial-gradient(120% 90% at 78% 22%,#000 10%,transparent 72%);
}
.lg-brand::after{
  content:"";position:absolute;inset-inline-start:-140px;inset-block-end:-180px;
  width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,16,46,.32),transparent 62%);filter:blur(26px);
}
.lg-brand>*{position:relative;z-index:1}
.mark{display:flex;align-items:center;gap:13px}
.mark-badge{
  width:44px;height:44px;border-radius:8px;background:var(--brand);
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;
  font-size:14px;letter-spacing:.5px;color:#fff;flex:0 0 auto;
  box-shadow:0 4px 14px -3px rgba(200,16,46,.6);
}
.mark-t{font-weight:500;font-size:14px;letter-spacing:-.005em}
.mark-s{font-size:12px;color:#93A8BC;margin-top:1px}
.lg-hero h1{
  font-size:clamp(30px,3.7vw,46px);line-height:1.18;margin:0 0 16px;
  font-weight:500;letter-spacing:-.025em;
}
.lg-hero p{color:#A8BCCD;max-width:46ch;margin:0;font-size:14.5px;line-height:1.7}
/* signature: the sheet-register rule */
.lg-stats{display:flex;gap:0;flex-wrap:wrap;margin-top:36px;border-top:1px solid rgba(255,255,255,.16);padding-top:6px}
.lg-stat{padding:14px 26px 2px 0;margin-inline-end:26px;border-inline-end:1px solid rgba(255,255,255,.1);position:relative}
.lg-stat:last-child{border-inline-end:none}
.lg-stat::before{
  content:"";position:absolute;inset-block-start:-6px;inset-inline-start:0;width:22px;height:2px;background:var(--brand);
}
.lg-stat b{display:block;font-family:var(--mono);font-size:28px;font-weight:500;color:#fff;line-height:1.1}
.lg-stat span{font-size:11.5px;color:#8CA2B6}
html[dir="ltr"] .lg-stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.lg-foot{font-size:11.5px;color:#7891A6;letter-spacing:.01em}

.lg-form{display:flex;align-items:center;justify-content:center;padding:44px 34px;background:var(--card)}
.lg-box{width:100%;max-width:376px;animation:rise .5s var(--ease) both}
.lg-box h2{margin:0 0 5px;font-size:23px;font-weight:500;letter-spacing:-.02em}
.lg-box .sub{color:var(--muted);margin:0 0 28px;font-size:13.5px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
.inp,select.inp,textarea.inp{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);
  background:#fff;transition:border-color .15s,box-shadow .15s;
}
.inp:hover:not(:disabled){border-color:#B9C6D2}
.inp:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(51,86,107,.13);outline:none}
.inp:disabled{background:var(--wash);color:var(--muted);cursor:not-allowed}
textarea.inp{resize:vertical;min-height:44px}
select.inp{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(0% + 14px) calc(50% + 1px),calc(0% + 19px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-start:33px;
}
html[dir="ltr"] select.inp{
  background-position:calc(100% - 19px) calc(50% + 1px),calc(100% - 14px) calc(50% + 1px);
  padding-inline-start:12px;padding-inline-end:33px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 17px;border-radius:var(--r-s);font-weight:500;font-size:13.5px;
  background:var(--ink);color:#fff;transition:background .15s,transform .1s,box-shadow .15s;
  white-space:nowrap;
}
.btn:hover{background:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);box-shadow:0 2px 10px -3px rgba(200,16,46,.55)}
.btn-primary:hover{background:var(--brand-dark);box-shadow:0 4px 16px -4px rgba(200,16,46,.6)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:var(--wash);border-color:#BFCBD6}
.btn-danger{background:#fff;border:1px solid #E8BCC4;color:var(--brand)}
.btn-danger:hover{background:#FCEFF1}
.btn-block{width:100%;padding:12px}
.btn-sm{padding:7px 12px;font-size:12.5px}
.err{background:#FCEFF1;border:1px solid #EFC3CB;color:var(--brand-dark);padding:9px 12px;border-radius:var(--r-s);font-size:12.5px;margin-bottom:13px}
.hint{margin-top:24px;padding-top:17px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted);line-height:1.75}
.hint code{font-family:var(--mono);background:var(--paper);padding:2px 6px;border-radius:4px;font-size:11.5px;color:var(--text)}
@media(max-width:900px){
  #login{grid-template-columns:1fr}
  .lg-brand{padding:30px 22px;gap:28px}
  .lg-brand::after{display:none}
  .lg-hero h1{font-size:26px}
  .lg-stats{margin-top:24px}
  .lg-stat{padding:12px 18px 2px 0;margin-inline-end:18px}
  .lg-stat b{font-size:22px}
}

/* ---------------- SHELL ---------------- */
.topbar{
  background:var(--ink);color:#fff;padding:0 22px;display:flex;align-items:center;
  gap:14px;height:60px;position:sticky;top:0;z-index:40;flex-wrap:nowrap;
}
.topbar .mark{min-width:0}
.topbar .mark>div{min-width:0}
.tb-title{font-weight:500;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;color:#8CA2B6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
.tb-btn{
  color:#BDCDDA;padding:7px 11px;border-radius:var(--r-s);font-size:12.5px;
  border:1px solid rgba(255,255,255,.16);transition:background .15s,color .15s;flex:0 0 auto;
}
.tb-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.chip-user{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border-radius:99px;background:rgba(255,255,255,.09)}
html[dir="ltr"] .chip-user{padding:4px 4px 4px 12px}
.avatar{
  width:30px;height:30px;border-radius:99px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:500;flex:0 0 auto;letter-spacing:.02em;
}
.chip-user .nm{font-size:12.5px;font-weight:500;line-height:1.15}
.chip-user .rl{font-size:10.5px;color:#8CA2B6;line-height:1.2}

.tabs{
  background:var(--card);border-bottom:1px solid var(--line);padding:9px 22px;
  display:flex;gap:4px;position:sticky;top:60px;z-index:35;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 15px;font-size:13.5px;color:var(--muted);border-radius:99px;
  white-space:nowrap;font-weight:400;transition:background .15s,color .15s;
}
.tab:hover{color:var(--text);background:var(--wash)}
.tab.on{color:#fff;background:var(--ink);font-weight:500}

main{padding:26px 22px 64px;max-width:1440px;margin:0 auto;animation:fade .3s var(--ease) both}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.025em;line-height:1.25}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:500;letter-spacing:-.01em}
.card-h .note{font-size:11.5px;color:var(--muted)}
.card-b{padding:18px}

/* ---------------- KPI ---------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px;margin-bottom:20px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;box-shadow:var(--sh-1);position:relative;overflow:hidden;
  animation:rise .45s var(--ease) both;transition:box-shadow .2s,transform .2s;
}
.kpi:nth-child(1){animation-delay:.02s}.kpi:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.14s}
.kpi:nth-child(5){animation-delay:.18s}
.kpi:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.kpi::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--c,var(--line))}
.kpi .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.kpi .val{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1.1;margin-top:4px;letter-spacing:-.02em}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}

/* ------- SIGNATURE: the load rule ------- */
.wl-row{
  display:grid;grid-template-columns:120px 1fr 56px;gap:14px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line-2);
}
.wl-row:last-child{border-bottom:none}
.wl-name{font-size:13px;font-weight:400;display:flex;align-items:center;gap:9px;min-width:0}
.wl-name .avatar{width:26px;height:26px;font-size:10.5px;background:var(--ink-3)}
.wl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-bar{
  height:26px;border-radius:5px;display:flex;overflow:hidden;
  border:1px solid var(--line-2);
  background-color:var(--wash);
  background-image:repeating-linear-gradient(90deg,rgba(97,116,138,.26) 0 1px,transparent 1px 5%);
}
.wl-seg{
  height:100%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;
  color:#fff;min-width:0;transition:flex-basis .55s var(--ease);
}
.wl-total{font-family:var(--mono);font-size:16px;text-align:end;color:var(--text);letter-spacing:-.02em}
.wl-total.zero{color:#A7B6C4}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:15px;padding-top:13px;border-top:1px solid var(--line-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-inline-end:6px}
.legend span{font-size:11.5px;color:var(--muted)}

/* ---------------- TABLE ---------------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:start;font-size:11px;font-weight:500;color:var(--muted);
  padding:10px 11px;background:var(--wash);
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2;
}
html[dir="ltr"] th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
th.sortable{cursor:pointer;user-select:none;transition:color .15s}
th.sortable:hover{color:var(--text)}
th .ar{opacity:.5;font-size:9px}
td{padding:11px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--wash)}
tbody tr:last-child td{border-bottom:none}
.t-id{
  font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
  border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:var(--wash);
}
.t-desc{max-width:340px;min-width:190px;line-height:1.5}
.t-desc .rem{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.t-rem{max-width:230px;min-width:120px;color:var(--muted);font-size:12.5px;line-height:1.5}
.t-rem .dash{color:#BECAD5}
.rem-txt{display:block}
.rem-n{
  display:inline-block;margin-inline-start:6px;padding:0 6px;border-radius:99px;
  background:var(--ink);color:#fff;font-family:var(--mono);font-size:10px;vertical-align:middle;
}
.spine{width:3px;padding:0 !important;background:var(--c)}
.dt{font-family:var(--mono);font-size:12px;white-space:nowrap;letter-spacing:-.01em}
.dt.late{color:var(--brand);font-weight:500}
/* status reads as a stamped mark, the way a drawing carries its revision state */
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:5px;
  font-size:11.5px;font-weight:500;white-space:nowrap;
  border:1px solid currentColor;
}
.pill i{width:5px;height:5px;border-radius:99px;background:currentColor;flex:0 0 auto}
.tag{
  display:inline-block;padding:2px 8px;border-radius:5px;background:var(--wash);
  color:var(--muted);font-size:11.5px;white-space:nowrap;border:1px solid var(--line-2);
}
.badge-late{
  display:inline-block;margin-inline-start:6px;padding:1px 7px;border-radius:4px;
  background:var(--brand);color:#fff;font-size:10.5px;font-weight:500;
}
.actions{display:flex;gap:5px;justify-content:flex-end}
.iconbtn{
  width:29px;height:29px;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;color:var(--muted);font-size:13px;transition:all .15s;
}
.iconbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.iconbtn.del:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{padding:58px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px;font-weight:500;letter-spacing:-.015em}

/* ---------------- FILTERS ---------------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters .inp{width:auto;min-width:132px;padding:8px 11px;font-size:12.5px}
.filters .search{min-width:220px;flex:1;max-width:350px}
.toggle{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
  padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-s);
  cursor:pointer;transition:border-color .15s,color .15s;
}
.toggle:hover{border-color:#BFCBD6;color:var(--text)}
.toggle input{accent-color:var(--brand);cursor:pointer}

/* ---------------- MODAL ---------------- */
.overlay{
  position:fixed;inset:0;background:rgba(16,23,32,.55);z-index:80;
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;
  overflow-y:auto;animation:fade .18s var(--ease) both;backdrop-filter:blur(3px);
}
.modal{
  background:var(--card);border-radius:14px;width:100%;max-width:660px;
  box-shadow:var(--sh-3);margin:auto;animation:pop .26s var(--ease) both;
}
.modal-h{padding:17px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:11px}
.modal-h h3{margin:0;font-size:16px;font-weight:500;letter-spacing:-.02em}
.modal-b{padding:20px;max-height:68dvh;overflow-y:auto}
.modal-f{
  padding:14px 20px;border-top:1px solid var(--line-2);display:flex;gap:9px;
  justify-content:flex-end;background:var(--wash);border-radius:0 0 14px 14px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.help{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}

/* ---------------- COMMENTS ---------------- */
#thread{
  max-height:220px;overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--r-s);background:var(--wash);padding:9px;
}
.cm{
  padding:9px 11px;background:#fff;border:1px solid var(--line-2);
  border-radius:var(--r-s);margin-bottom:8px;animation:rise .3s var(--ease) both;
}
.cm:last-child{margin-bottom:0}
.cm-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.cm-who{font-size:12px;font-weight:500}
.cm-when{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cm-del{margin-inline-start:auto;color:#B2C0CC;font-size:12px;line-height:1;padding:2px 5px;border-radius:4px;transition:all .15s}
.cm-del:hover{color:#fff;background:var(--brand)}
.cm-body{font-size:13px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.cm-empty{padding:16px;text-align:center;color:var(--muted);font-size:12.5px}
.cm-add{display:flex;gap:9px;align-items:flex-end;margin-top:9px}
.cm-add textarea{flex:1}

/* ---------------- MISC ---------------- */
.ref-tables{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.toast{
  position:fixed;inset-block-end:26px;inset-inline-start:50%;transform:translateX(50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;
  z-index:120;box-shadow:0 12px 32px -8px rgba(16,23,32,.5);animation:rise .28s var(--ease) both;
}
html[dir="ltr"] .toast{transform:translateX(-50%)}
.banner{
  background:#FFF9EB;border:1px solid #EBDCAE;color:#78590E;padding:11px 15px;
  border-radius:var(--r-s);font-size:12.5px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;
}
.banner.ok{background:#ECF7F1;border-color:#B0DDC5;color:#116340}
.btn-google{background:#fff;border:1px solid var(--line);color:var(--text);gap:10px;font-weight:500}
.btn-google:hover{background:var(--wash);border-color:#BFCBD6}
.btn-google svg{flex:0 0 auto}
.btn-google:disabled{opacity:.6;cursor:default}
.em{font-family:var(--mono);font-size:11.5px;color:var(--text)}
.em-no{font-size:11.5px;color:#A7B6C4}
.acct{display:flex;align-items:center;gap:12px}
.acct .avatar{width:40px;height:40px;font-size:14px}
.acct-n{font-weight:500;font-size:14px}
.acct-e{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---------------- MOBILE ---------------- */
@media(max-width:820px){
  .topbar{padding:0 13px;gap:9px;height:56px}
  .tb-sub{display:none}
  .tb-title{font-size:13px}
  .chip-user .rl{display:none}
  .chip-user .nm{max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* nav becomes a thumb-reach bar at the bottom of the screen */
  .tabs{
    position:fixed;inset-block-end:0;inset-inline:0;top:auto;
    border-top:1px solid var(--line);border-bottom:none;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
    justify-content:space-around;gap:2px;
    box-shadow:0 -4px 20px -8px rgba(16,23,32,.22);
  }
  .tab{flex:1;text-align:center;padding:9px 6px;font-size:12.5px}
  main{padding:18px 13px 92px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi .val{font-size:25px}
  .wl-row{grid-template-columns:104px 1fr 36px;gap:10px}
  .page-head h2{font-size:19px}
  .filters .search{max-width:none;flex:1 0 100%}
  .toast{inset-block-end:76px}
  .modal-b{max-height:none}

  /* task register becomes a stack of record cards */
  .tasks-tw{overflow:visible}
  .tasks-tw table,.tasks-tw tbody,.tasks-tw tr,.tasks-tw td{display:block;width:auto}
  .tasks-tw thead{display:none}
  .tasks-tw tbody tr{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--sh-1);margin-bottom:11px;
    padding:42px 15px 11px;overflow:hidden;
  }
  .tasks-tw td.t-id{
    position:absolute;inset-block-start:11px;inset-inline-end:14px;
    display:inline-block;width:auto;padding:2px 7px;
  }
  .tasks-tw td.t-id::before{content:none}
  .tasks-tw tbody tr:hover{background:var(--card)}
  .tasks-tw td{border:none;padding:4px 0;display:flex;gap:11px;align-items:flex-start}
  .tasks-tw td::before{
    content:attr(data-l);flex:0 0 90px;font-size:11px;
    font-family:var(--font);          /* never inherit the mono register face */
    letter-spacing:normal;color:var(--muted);padding-top:2px;line-height:1.45;
  }
  html[dir="ltr"] .tasks-tw td::before{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .tasks-tw td.spine{position:absolute;inset-block:0;inset-inline-start:0;width:4px;padding:0;display:block}
  .tasks-tw td.spine::before{content:none}
  .tasks-tw td.t-desc{max-width:none;font-weight:500;padding-bottom:8px}
  .tasks-tw td.t-rem{max-width:none}
  .tasks-tw td.acts{justify-content:flex-end;padding-top:9px;margin-top:5px;border-top:1px solid var(--line-2)}
  .tasks-tw td.acts::before{content:none}
  .tasks-tw .actions{width:100%;justify-content:flex-end}
}
@media(max-width:420px){
  .chip-user .nm{display:none}
  .chip-user{padding:4px}
  .topbar{gap:7px}
  .tb-btn{padding:6px 9px;font-size:12px}
  .tasks-tw td::before{flex-basis:76px}
}
@media print{
  .topbar,.tabs,.filters,.actions,.page-head .btn,.banner,.toast{display:none !important}
  body{background:#fff}
  .card{box-shadow:none;border-color:#bbb}
  main{padding:0}
}

/* ---------- 5. STORAGE ADAPTER ----------
   LocalStore keeps everything in this browser.
   Drop in firebase-adapter.js (sets window.RemoteStore) to share data live. */
const KEY = "tms_procurement_v1";
const LocalStore = {
  kind:"local",
  async init(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) DB = JSON.parse(raw);
    }catch(e){ console.warn("Could not read saved data:", e); }
    if(!DB.users || !DB.users.length) DB.users = DEFAULT_USERS.map(u=>({...u, pw:hash(DEFAULT_PW)}));
    if(!DB.tasks) DB.tasks = [];
    if(typeof DB.seq !== "number") DB.seq = DB.tasks.reduce((m,x)=>Math.max(m,x.seq||0),0);
    if(!DB.seeded){ seedExample(); DB.seeded = true; }
    await this.flush();
  },
  async flush(){
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ console.warn("Could not save. Data will be lost when the tab closes.", e); }
  },
  async putTask(task){ const i = DB.tasks.findIndex(x=>x.id===task.id); if(i<0) DB.tasks.push(task); else DB.tasks[i]=task; await this.flush(); },
  async removeTask(id){ DB.tasks = DB.tasks.filter(x=>x.id!==id); await this.flush(); },
  async putUser(u){ const i = DB.users.findIndex(x=>x.id===u.id); if(i<0) DB.users.push(u); else DB.users[i]=u; await this.flush(); },
  async removeUser(id){ DB.users = DB.users.filter(x=>x.id!==id); await this.flush(); },
  async replaceAll(next){ DB = next; await this.flush(); },
  onChange(cb){ window.addEventListener("storage", e=>{ if(e.key===KEY){ try{DB=JSON.parse(e.newValue);cb();}catch(_){} } }); }
};

/* ---------- 6. HELPERS ---------- */
function hash(str){ // deterministic, non-cryptographic. See README: real auth comes with Firebase.
  let h1=0x811c9dc5, h2=0x01000193;
  const s = "cr18g:"+str;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2+c^(h2<<5),2654435761)>>>0; }
  return (h1.toString(36)+h2.toString(36));
}
function todayISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso,n){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoOf(dt); }
function calcDue(priority, dateAssigned){
  const days = TARGET_DAYS[priority];
  if(days===null || days===undefined || !dateAssigned) return "";
  return addDays(dateAssigned, days);
}
function isOverdue(task){
  if(task.status==="Completed") return false;
  if(!task.dueDate) return false;
  return task.dueDate < todayISO();
}
function fmtDate(iso){
  if(!iso) return "—";
  const [y,m,d]=iso.split("-");
  return d+"/"+m+"/"+y;
}
function findUserByEmail(email){
  const e = (email||"").toLowerCase().trim();
  if(!e) return null;
  return DB.users.find(u => (u.email||"").toLowerCase().trim() === e) || null;
}
function assignees(){ return DB.users.filter(u=>u.isAssignee).map(u=>u.name); }
function assigners(){ const a=DB.users.filter(u=>u.isAssigner), b=DB.users.filter(u=>!u.isAssigner && u.role!=="member"); return [...a,...b].map(u=>u.name); }
function userByName(n){ return DB.users.find(u=>u.name===n); }
function displayName(u){ return LANG==="ar" ? (u.nameAr||u.name) : u.name; }
function initials(n){ return (n||"?").replace(/^(Mr|Mrs|Ms)\.?\s+/i,"").trim().slice(0,2).toUpperCase(); }
function canCreate(){ return !!ME; }                       /* anyone can log a task */
function canAssignOthers(){ return !!ME && (ME.role==="admin" || ME.role==="manager"); }
function canEdit(task){
  if(!ME) return false;
  if(ME.role==="admin"||ME.role==="manager") return true;
  return task.assignedTo===ME.name || task.createdBy===ME.id;
}
function fmtWhen(ts){
  if(!ts) return "";
  const d=new Date(ts), z=n=>String(n).padStart(2,"0");
  return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes());
}
/* Comment thread. Legacy single-field remarks are shown as the first entry
   so nothing written before this feature is lost. */
function commentsOf(x){
  const list = Array.isArray(x.comments) ? x.comments.slice() : [];
  if(x.remarks) list.unshift({id:"legacy", uid:"", name:"", text:x.remarks, at:x.createdAt||0, legacy:true});
  return list;
}
function commentText(x){ return commentsOf(x).map(c=>c.text).join(" "); }
function remCell(x){
  const c = commentsOf(x);
  if(!c.length) return '<span class="dash">—</span>';
  const last = c[c.length-1];
  return '<span class="rem-txt">'+esc(last.text)+'</span>'
       + (c.length>1 ? '<span class="rem-n">'+c.length+'</span>' : '');
}
function canDelComment(c){ return !c.legacy && (c.uid===ME.id || ME.role==="admin" || ME.role==="manager"); }
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
}

function renderLogin(){

async function googleSignIn(){
  const err = document.getElementById("loginErr");
  const btn = document.getElementById("gBtn");
  err.hidden = true;
  btn.disabled = true;
  document.getElementById("gLabel").textContent = t("signingIn");
  try{
    await AUTH.signIn();          /* onChange takes it from here */
  }catch(ex){
    const code = (ex && ex.code) || "";
    if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request"){
      /* the person backed out — say nothing */
    } else if(code === "auth/popup-blocked"){
      err.textContent = t("popupBlocked"); err.hidden = false;
    } else {
      err.textContent = t("signInFailed") + " " + (code || "");
      err.hidden = false;
      console.error("Google sign-in:", ex);
    }
  }
  btn.disabled = false;
  document.getElementById("gLabel").textContent = t("signInGoogle");
}

function doLogin(e){
  e.preventDefault();
  const id = document.getElementById("lgUser").value;
  const pw = document.getElementById("lgPass").value;
  const u = DB.users.find(x=>x.id===id);
  const err = document.getElementById("loginErr");
  if(!u || u.pw !== hash(pw)){ err.textContent = t("wrongPw"); err.hidden=false; return; }
  err.hidden = true;
  document.getElementById("lgPass").value = "";
  enterApp(u);
}
async function logout(){

  document.getElementById("app").hidden = true;
  document.getElementById("login").hidden = false;
  document.getElementById("loginErr").hidden = true;

/* ---------- 11. TASKS ---------- */
function filtered(){
  let rows = DB.tasks.slice();
  const q = FILT.q.trim().toLowerCase();
  if(q) rows = rows.filter(x=>(x.description+" "+commentText(x)).toLowerCase().includes(q));
  if(FILT.to) rows = rows.filter(x=>x.assignedTo===FILT.to);
  if(FILT.st) rows = rows.filter(x=>x.status===FILT.st);
  if(FILT.pr) rows = rows.filter(x=>x.priority===FILT.pr);
  if(FILT.ty) rows = rows.filter(x=>x.type===FILT.ty);
  if(FILT.mine && ME) rows = rows.filter(x=>x.assignedTo===ME.name || x.assignedBy===ME.name);
  if(FILT.open) rows = rows.filter(x=>x.status!=="Completed");
  const k = SORT.key, dir = SORT.dir==="asc"?1:-1;
  rows.sort((a,b)=>{
    let va=a[k]??"", vb=b[k]??"";
    if(k==="priority"){ va=PRIORITIES.indexOf(a.priority); vb=PRIORITIES.indexOf(b.priority); }
    if(typeof va==="number"&&typeof vb==="number") return (va-vb)*dir;
    return String(va).localeCompare(String(vb))*dir;
  });
  return rows;
}
function setF(k,v){ FILT[k]=v; render(); }
function sortBy(k){ SORT = {key:k, dir:(SORT.key===k && SORT.dir==="asc")?"desc":"asc"}; render(); }

  return `

  <div class="filters">

    </select>

      ${PRIORITIES.map(s=>`<option value="${esc(s)}" ${FILT.pr===s?"selected":""}>${esc(lbl("priority",s))}</option>`).join("")}
    </select>
    <select class="inp" onchange="setF('ty',this.value)">
      <option value="">${esc(t("allTypes"))}</option>
      ${TYPES.map(s=>`<option value="${esc(s)}" ${FILT.ty===s?"selected":""}>${esc(lbl("type",s))}</option>`).join("")}

function syncDue(keep){
  const p = document.getElementById("fPrio").value;
  const da = document.getElementById("fDate").value;
  const due = document.getElementById("fDue");
  const help = document.getElementById("dueHelp");
  const auto = TARGET_DAYS[p] !== null && TARGET_DAYS[p] !== undefined;
  if(auto){
    if(!keep || !due.value) due.value = calcDue(p, da);
    else due.value = calcDue(p, da);
    help.textContent = t("dueAuto");
  } else {
    help.textContent = t("dueManual");
  }
}
function syncDone(){
  const st = document.getElementById("fStatus").value;
  const done = document.getElementById("fDone");
  if(st==="Completed" && !done.value) done.value = todayISO();
  if(st!=="Completed") done.value = "";
}
function threadHTML(x){
  const list = commentsOf(x);
  if(!list.length) return `<div class="cm-empty">${esc(t("noComments"))}</div>`;
  return list.map(c=>`
    <div class="cm">
      <div class="cm-head">
        <span class="cm-who">${c.legacy ? esc(t("legacyNote")) : esc(c.name||"—")}</span>
        <span class="cm-when">${esc(fmtWhen(c.at))}</span>
        ${canDelComment(c)?`<button class="cm-del" title="${esc(t("del"))}" onclick="delComment('${x.id}','${c.id}')">✕</button>`:""}
      </div>
      <div class="cm-body">${esc(c.text)}</div>
    </div>`).join("");
}
async function addComment(taskId){
  const box = document.getElementById("fNew");
  const text = box.value.trim();
  if(!text) { box.focus(); return; }
  const task = DB.tasks.find(v=>v.id===taskId);
  if(!task) return;
  if(!Array.isArray(task.comments)) task.comments = [];
  task.comments.push({
    id:"c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    uid:ME.id, name:ME.name, text, at:Date.now()
  });
  task.updatedAt = Date.now();
  await Store.putTask(task);
  box.value = "";
  const th = document.getElementById("thread");
  if(th){ th.innerHTML = threadHTML(task); th.scrollTop = th.scrollHeight; }
  render(); toast(t("commentAdded"));
}
async function delComment(taskId, commentId){
  if(!confirm(t("delComment"))) return;
  const task = DB.tasks.find(v=>v.id===taskId);
  if(!task || !Array.isArray(task.comments)) return;
  task.comments = task.comments.filter(c=>c.id!==commentId);
  task.updatedAt = Date.now();
  await Store.putTask(task);
  const th = document.getElementById("thread");
  if(th) th.innerHTML = threadHTML(task);
  render(); toast(t("deleted"));
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

function firstComment(){
  const el = document.getElementById("fFirst");
  const text = el ? el.value.trim() : "";
  if(!text) return [];
  return [{ id:"c_"+Date.now().toString(36), uid:ME.id, name:ME.name, text, at:Date.now() }];
}
async function saveTask(id){
  const g = i => document.getElementById(i);
  const prev = id ? DB.tasks.find(v=>v.id===id) : null;
  if(prev && !canEdit(prev)){ toast(t("noPerm")); return; }
  if(!prev && !canCreate()){ toast(t("noCreate")); return; }
  const desc = g("fDesc").value.trim();
  if(!desc){ g("fDesc").focus(); g("fDesc").style.borderColor="var(--brand)"; return; }
  const existing = id ? DB.tasks.find(x=>x.id===id) : null;
  const task = {
    id: id || ("t_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    seq: existing ? existing.seq : (++DB.seq),
    type: g("fType").value, priority: g("fPrio").value, description: desc,
    assignedBy: g("fBy").value,
    assignedTo: existing ? g("fTo").value : (canAssignOthers() ? g("fTo").value : ME.name),
    dateAssigned: g("fDate").value, timeAssigned: g("fTime").value,
    dueDate: g("fDue").value, completionDate: g("fDone").value,
    status: g("fStatus").value,
    remarks: existing ? (existing.remarks||"") : "",
    comments: existing ? (existing.comments||[]) : firstComment(),
    createdBy: existing ? existing.createdBy : ME.id,
    createdAt: existing ? existing.createdAt : Date.now(),
    updatedAt: Date.now()
  };
  await Store.putTask(task);
  if(!existing) await Store.flush?.();
  closeModal(); render(); toast(t("saved"));
}
async function delTask(id){
  if(!confirm(t("confirmDel"))) return;
  await Store.removeTask(id);
  closeModal(); render(); toast(t("deleted"));
}

/* ---------- 15. EXPORT / IMPORT ---------- */
function exportCSV(){
  const head = ["N","Type","Priority","Description","Assigned By","Assigned To","Date Assigned","Time Assigned","Due Date","Completion Date","Status","Remarks"];
  const thread = x => commentsOf(x).map(c=>(c.legacy?"":"["+c.name+" "+fmtWhen(c.at)+"] ")+c.text).join("\n");
  const rows = filtered().map(x=>[x.seq,x.type,x.priority,x.description,x.assignedBy,x.assignedTo,x.dateAssigned,x.timeAssigned,x.dueDate,x.completionDate,x.status,thread(x)]);
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const csv = "\uFEFF" + [head.map(q).join(","), ...rows.map(r=>r.map(q).join(","))].join("\r\n");
  download(new Blob([csv],{type:"text/csv;charset=utf-8"}), `Task_Management_${todayISO()}.csv`);
}
function exportJSON(){
  download(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}), `tms_backup_${todayISO()}.json`);
}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const next = JSON.parse(r.result);
      if(!next.users || !next.tasks) throw new Error("shape");
      await Store.replaceAll(next);
      ME = DB.users.find(u=>u.id===ME.id) || DB.users[0];
      render(); toast(t("imported"));
    }catch(e){ toast(t("importBad")); }
    input.value="";
  };
  r.readAsText(f);
}
function download(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ---------- 16. BOOT ---------- */
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

const STORE_CTX = () => ({ getDB:()=>DB, setDB:d=>{DB=d}, DEFAULT_USERS, DEFAULT_PW, hash, todayISO });

/* Google account signed in: open the database, then match the address
   against the team list. An address nobody owns does not get in. */
let _opening = false;
async function onGoogleUser(gu){
  if(!gu){                       /* signed out */
    GOOGLE_USER = null; ME = null;
    document.getElementById("app").hidden = true;
    document.getElementById("login").hidden = false;
    renderLogin();
    return;
  }
  if(_opening) return;
  _opening = true;
  GOOGLE_USER = gu;
  try{
    if(Store.kind !== "firebase"){
      Store = await window.RemoteStoreFactory(STORE_CTX());
      await Store.init();
      Store.onChange(()=>{ if(ME) render(); else renderLogin(); });
      console.info("Task Management: connected to Firebase.");
    }
    const user = findUserByEmail(gu.email);
    if(!user){
      showNotAllowed(gu.email || "");
      renderLoginStats();
      _opening = false;
      return;
    }
    enterApp(user);
  }catch(e){
    console.error("Task Management: could not open the shared database.", e);
    const err = document.getElementById("loginErr");
    err.textContent = t("signInFailed") + " " + (e && e.code ? e.code : "");
    err.hidden = false;
  }
  _opening = false;
}

async function boot(){
  /* firebase-adapter.js, when loaded, defines RemoteAuthFactory and
     RemoteStoreFactory. Module scripts run before DOMContentLoaded. */
  if(window.RemoteAuthFactory && window.RemoteStoreFactory){
    try{
      AUTH = await window.RemoteAuthFactory();
    }catch(e){
      console.error("Task Management: Google sign-in unavailable, falling back to this browser's local storage.", e);
      AUTH = null;
    }
  }

  if(AUTH){
    applyLang();
    const existing = await AUTH.ready();      /* restores a previous session */
    AUTH.onChange(onGoogleUser);
    if(!existing){ renderLogin(); renderLoginStats(); }
    return;                                    /* onGoogleUser drives the rest */
  }

  await Store.init();
  Store.onChange?.(()=>{ if(ME) render(); else renderLogin(); });
  applyLang();
  const savedId = sessionStorage.getItem("tms_me");
  const u = savedId && DB.users.find(x=>x.id===savedId);
  if(u){
    ME = u;
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    FILT.mine = (u.role==="member");
    renderShell(); render();
  } else {
    renderLogin();
  }
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
