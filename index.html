<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة المهام — قسم المشتريات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#101D29; --ink-2:#1B2C3D; --paper:#EDF1F4; --card:#FFFFFF;
  --line:#D6DEE6; --line-2:#E8EDF1; --muted:#5F7386; --text:#16232E;
  --brand:#C8102E; --brand-dark:#9C0C24; --blue:#1B6E8C;
  --s-not:#7B8CA0; --s-prog:#B87503; --s-done:#1B7A4B; --s-late:#C8102E; --s-hold:#6B5F92;
  --p1:#C8102E; --p2:#D9730D; --p3:#1B6E8C; --p4:#4E7A3A; --p5:#7B8CA0;
  --font-ar:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  --font-en:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:6px; --sh:0 1px 2px rgba(16,29,41,.06),0 4px 14px rgba(16,29,41,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--text);
  font-family:var(--font-ar); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
html[lang="en"] body{font-family:var(--font-en)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr}
.lg-brand{
  background:var(--ink); color:#fff; padding:48px 44px; display:flex;
  flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;
}
.lg-brand::before{
  content:"";position:absolute;inset:0;opacity:.16;
  background-image:linear-gradient(rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(circle at 70% 30%,#000,transparent 72%);
}
.lg-brand>*{position:relative}
.mark{display:flex;align-items:center;gap:12px}
.mark-badge{
  width:42px;height:42px;border-radius:5px;background:var(--brand);
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.5px;color:#fff;
}
.mark-t{font-weight:600;font-size:14px;letter-spacing:.02em}
.mark-s{font-size:12px;color:#93A7B8}
.lg-hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.25;margin:0 0 14px;font-weight:600;letter-spacing:-.01em}
.lg-hero p{color:#A7BACA;max-width:44ch;margin:0;font-size:14px}
.lg-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:30px}
.lg-stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;color:#fff}
.lg-stat span{font-size:11.5px;color:#8FA5B7;letter-spacing:.06em;text-transform:uppercase}
.lg-foot{font-size:11.5px;color:#7A8FA2}

.lg-form{display:flex;align-items:center;justify-content:center;padding:40px 32px;background:var(--card)}
.lg-box{width:100%;max-width:370px}
.lg-box h2{margin:0 0 4px;font-size:20px;font-weight:600}
.lg-box .sub{color:var(--muted);margin:0 0 26px;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:5px}
.inp,select.inp,textarea.inp{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:#fff;transition:border-color .12s,box-shadow .12s;
}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,110,140,.12);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(0% + 14px) 50%,calc(0% + 19px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-start:32px}
html[dir="ltr"] select.inp{background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;padding-inline-start:11px;padding-inline-end:32px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:var(--r);font-weight:500;font-size:13.5px;
  background:var(--ink);color:#fff;transition:background .12s,transform .06s;
}
.btn:hover{background:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand)}.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:var(--line-2)}
.btn-danger{background:#fff;border:1px solid #E7B9C1;color:var(--brand)}
.btn-danger:hover{background:#FCEEF0}
.btn-block{width:100%;padding:11px}
.btn-sm{padding:6px 11px;font-size:12.5px}
.err{background:#FCEEF0;border:1px solid #EFC2CB;color:var(--brand-dark);padding:8px 11px;border-radius:var(--r);font-size:12.5px;margin-bottom:12px}
.hint{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted);line-height:1.7}
.hint code{font-family:var(--mono);background:var(--line-2);padding:1px 5px;border-radius:3px;font-size:11.5px}
@media(max-width:860px){#login{grid-template-columns:1fr}.lg-brand{padding:28px 22px;gap:26px}.lg-hero h1{font-size:24px}.lg-stats{gap:20px}}

/* ---------- SHELL ---------- */
.topbar{
  background:var(--ink);color:#fff;padding:0 20px;display:flex;align-items:center;
  gap:14px;height:56px;position:sticky;top:0;z-index:40;flex-wrap:nowrap;
}
.topbar .mark{min-width:0}
.topbar .mark>div{min-width:0}
.tb-title{font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{flex:0 0 auto}
.tb-sub{font-size:11px;color:#8FA5B7}
.tb-spacer{flex:1}
.tb-btn{color:#B9CAD8;padding:6px 10px;border-radius:var(--r);font-size:12.5px;border:1px solid rgba(255,255,255,.14)}
.tb-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.chip-user{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:99px;background:rgba(255,255,255,.09)}
html[dir="ltr"] .chip-user{padding:4px 4px 4px 10px}
.avatar{width:28px;height:28px;border-radius:99px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 auto;letter-spacing:.02em}
.chip-user .nm{font-size:12.5px;font-weight:500;line-height:1.1}
.chip-user .rl{font-size:10.5px;color:#93A7B8}
.tabs{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:2px;position:sticky;top:56px;z-index:35;overflow-x:auto}
.tab{padding:12px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
main{padding:22px 20px 60px;max-width:1440px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:13.5px;font-weight:600}
.card-h .note{font-size:11.5px;color:var(--muted)}
.card-b{padding:16px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--c,var(--line))}
.kpi .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.kpi .val{font-family:var(--mono);font-size:27px;font-weight:500;line-height:1.15;margin-top:3px}
.kpi .sub{font-size:11px;color:var(--muted)}

/* ---------- WORKLOAD (signature) ---------- */
.wl-row{display:grid;grid-template-columns:112px 1fr 54px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.wl-row:last-child{border-bottom:none}
.wl-name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.wl-name .avatar{width:24px;height:24px;font-size:10.5px;background:var(--ink-2)}
.wl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-bar{height:22px;background:repeating-linear-gradient(45deg,#F2F5F8,#F2F5F8 5px,#E9EEF3 5px,#E9EEF3 10px);border-radius:3px;display:flex;overflow:hidden;border:1px solid var(--line-2)}
.wl-seg{height:100%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:#fff;min-width:0;transition:flex-basis .35s ease}
.wl-total{font-family:var(--mono);font-size:15px;text-align:end;color:var(--text)}
.wl-total.zero{color:#A9B7C4}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-inline-end:5px}
.legend span{font-size:11.5px;color:var(--muted)}

/* ---------- TABLE ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:start;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase;padding:9px 10px;background:#F6F8FA;border-bottom:1px solid var(--line);white-space:nowrap;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .ar{opacity:.45;font-size:9px}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:hover{background:#F8FAFB}
.t-id{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.t-desc{max-width:340px;min-width:200px}
.t-desc .rem{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.t-rem{max-width:220px;min-width:120px;color:var(--muted);font-size:12.5px}
.t-rem .dash{color:#C3CDD6}
.spine{width:3px;padding:0 !important;background:var(--c)}
.dt{font-family:var(--mono);font-size:12px;white-space:nowrap}
.dt.late{color:var(--brand);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:99px;background:currentColor;flex:0 0 auto}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;background:var(--line-2);color:var(--muted);font-size:11.5px;white-space:nowrap}
.badge-late{display:inline-block;margin-inline-start:6px;padding:1px 6px;border-radius:3px;background:#FCEEF0;color:var(--brand);font-size:10.5px;font-weight:600}
.actions{display:flex;gap:5px;justify-content:flex-end}
.iconbtn{width:27px;height:27px;border-radius:5px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);font-size:13px}
.iconbtn:hover{background:var(--line-2);color:var(--text)}
.iconbtn.del:hover{background:#FCEEF0;color:var(--brand);border-color:#EFC2CB}
.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px;font-weight:600}

/* ---------- FILTERS ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .inp{width:auto;min-width:130px;padding:7px 10px;font-size:12.5px}
.filters .search{min-width:210px;flex:1;max-width:340px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:7px 11px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.toggle input{accent-color:var(--brand)}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,29,41,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{background:var(--card);border-radius:8px;width:100%;max-width:640px;box-shadow:0 18px 50px rgba(16,29,41,.28);margin:auto}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:15px;font-weight:600}
.modal-b{padding:18px;max-height:70dvh;overflow-y:auto}
.modal-f{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;background:#FAFBFC;border-radius:0 0 8px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.help{font-size:11.5px;color:var(--muted);margin-top:4px}
.ro{background:#F4F7F9;color:var(--muted)}

/* ---------- MISC ---------- */
.ref-tables{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.toast{position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:120;box-shadow:0 8px 24px rgba(16,29,41,.3)}
html[dir="ltr"] .toast{transform:translateX(-50%)}
.banner{background:#FFF8E7;border:1px solid #EBD9AC;color:#7A5B10;padding:9px 13px;border-radius:var(--r);font-size:12.5px;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
@media(max-width:760px){
  .topbar{padding:0 12px;gap:9px}
  .tb-sub{display:none}
  .tb-title{font-size:12.5px}
  .chip-user .rl{display:none}
  .chip-user .nm{max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{padding:0 12px}
  main{padding:16px 12px 56px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi .val{font-size:23px}
  .wl-row{grid-template-columns:96px 1fr 34px;gap:9px}
  .page-head h2{font-size:16px}
  .filters .search{max-width:none;width:100%;flex:1 0 100%}
}
@media(max-width:430px){
  .chip-user .nm{display:none}
  .chip-user{padding:4px}
  .topbar{gap:7px}
  .tb-btn{padding:6px 8px;font-size:12px}
}
@media print{.topbar,.tabs,.filters,.actions,.page-head .btn,.banner{display:none !important}body{background:#fff}.card{box-shadow:none;border-color:#ccc}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="lg-brand">
    <div class="mark">
      <div class="mark-badge">18</div>
      <div>
        <div class="mark-t" data-i18n="company"></div>
        <div class="mark-s" data-i18n="project"></div>
      </div>
    </div>
    <div class="lg-hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
      <div class="lg-stats">
        <div class="lg-stat"><b class="mono" id="lgTasks">0</b><span data-i18n="statTasks"></span></div>
        <div class="lg-stat"><b class="mono" id="lgOpen">0</b><span data-i18n="statOpen"></span></div>
        <div class="lg-stat"><b class="mono" id="lgTeam">0</b><span data-i18n="statTeam"></span></div>
      </div>
    </div>
    <div class="lg-foot" data-i18n="brandFoot"></div>
  </div>

  <div class="lg-form">
    <div class="lg-box">
      <div style="display:flex;justify-content:flex-end;margin-bottom:18px">
        <button class="btn btn-ghost btn-sm" onclick="toggleLang()" id="langBtn2">English</button>
      </div>
      <h2 data-i18n="signIn"></h2>
      <p class="sub" data-i18n="signInSub"></p>
      <div id="loginErr" class="err" hidden></div>
      <form onsubmit="doLogin(event)">
        <div class="field">
          <label for="lgUser" data-i18n="username"></label>
          <select class="inp" id="lgUser"></select>
        </div>
        <div class="field">
          <label for="lgPass" data-i18n="password"></label>
          <input class="inp" id="lgPass" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="signInBtn"></button>
      </form>
      <div class="hint" id="loginHint"></div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="topbar">
    <div class="mark">
      <div class="mark-badge" style="width:34px;height:34px;font-size:11px">18</div>
      <div>
        <div class="tb-title" data-i18n="appName"></div>
        <div class="tb-sub" data-i18n="project"></div>
      </div>
    </div>
    <div class="tb-spacer"></div>
    <button class="tb-btn" onclick="toggleLang()" id="langBtn">English</button>
    <div class="chip-user">
      <div class="avatar" id="meAvatar"></div>
      <div><div class="nm" id="meName"></div><div class="rl" id="meRole"></div></div>
    </div>
    <button class="tb-btn" onclick="logout()" data-i18n="logout"></button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>

<script>
/* =====================================================================
   Task Management System — Procurement Department

/* ---------- 1. REFERENCE DATA (from the INDEX sheet) ---------- */

/* ---------- 2. DEFAULT USERS ---------- */

  {id:"u_yu",        name:"Mr Yu",     nameAr:"م. يو",    role:"manager", pw:null, isAssignee:false, isAssigner:true},
];
const DEFAULT_PW = "1234";

/* ---------- 3. TRANSLATIONS ---------- */
const T = {
  ar:{
    company:"مجموعة السكك الحديدية الصينية — المكتب 18",
    project:"رؤى المدينة — سوبربلوك 5 · قسم المشتريات",

/* ---------- 5. STORAGE ADAPTER ----------
   LocalStore keeps everything in this browser.
   Drop in firebase-adapter.js (sets window.RemoteStore) to share data live. */
const KEY = "tms_procurement_v1";
const LocalStore = {
  kind:"local",
  async init(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) DB = JSON.parse(raw);
    }catch(e){ console.warn("Could not read saved data:", e); }
    if(!DB.users || !DB.users.length) DB.users = DEFAULT_USERS.map(u=>({...u, pw:hash(DEFAULT_PW)}));
    if(!DB.tasks) DB.tasks = [];
    if(typeof DB.seq !== "number") DB.seq = DB.tasks.reduce((m,x)=>Math.max(m,x.seq||0),0);
    if(!DB.seeded){ seedExample(); DB.seeded = true; }
    await this.flush();
  },
  async flush(){
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ console.warn("Could not save. Data will be lost when the tab closes.", e); }
  },
  async putTask(task){ const i = DB.tasks.findIndex(x=>x.id===task.id); if(i<0) DB.tasks.push(task); else DB.tasks[i]=task; await this.flush(); },
  async removeTask(id){ DB.tasks = DB.tasks.filter(x=>x.id!==id); await this.flush(); },
  async putUser(u){ const i = DB.users.findIndex(x=>x.id===u.id); if(i<0) DB.users.push(u); else DB.users[i]=u; await this.flush(); },
  async removeUser(id){ DB.users = DB.users.filter(x=>x.id!==id); await this.flush(); },
  async replaceAll(next){ DB = next; await this.flush(); },
  onChange(cb){ window.addEventListener("storage", e=>{ if(e.key===KEY){ try{DB=JSON.parse(e.newValue);cb();}catch(_){} } }); }
};
let Store = LocalStore;   // replaced at boot if firebase-adapter.js is loaded

  });
}

/* ---------- 6. HELPERS ---------- */
function hash(str){ // deterministic, non-cryptographic. See README: real auth comes with Firebase.
  let h1=0x811c9dc5, h2=0x01000193;
  const s = "cr18g:"+str;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2+c^(h2<<5),2654435761)>>>0; }
  return (h1.toString(36)+h2.toString(36));
}
function todayISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso,n){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoOf(dt); }
function calcDue(priority, dateAssigned){
  const days = TARGET_DAYS[priority];
  if(days===null || days===undefined || !dateAssigned) return "";
  return addDays(dateAssigned, days);
}
function isOverdue(task){
  if(task.status==="Completed") return false;
  if(!task.dueDate) return false;
  return task.dueDate < todayISO();
}
function fmtDate(iso){
  if(!iso) return "—";
  const [y,m,d]=iso.split("-");
  return d+"/"+m+"/"+y;
}
function assignees(){ return DB.users.filter(u=>u.isAssignee).map(u=>u.name); }
function assigners(){ const a=DB.users.filter(u=>u.isAssigner), b=DB.users.filter(u=>!u.isAssigner && u.role!=="member"); return [...a,...b].map(u=>u.name); }
function userByName(n){ return DB.users.find(u=>u.name===n); }
function displayName(u){ return LANG==="ar" ? (u.nameAr||u.name) : u.name; }
function initials(n){ return (n||"?").replace(/^(Mr|Mrs|Ms)\.?\s+/i,"").trim().slice(0,2).toUpperCase(); }
function canEdit(task){
  if(!ME) return false;
  if(ME.role==="admin"||ME.role==="manager") return true;
  return task.assignedTo===ME.name || task.createdBy===ME.id;
}
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
}

function toggleLang(){ LANG = LANG==="ar" ? "en" : "ar"; localStorage.setItem("tms_lang",LANG); applyLang(); }
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG==="ar" ? "rtl" : "ltr";
  const label = LANG==="ar" ? "English" : "العربية";
  ["langBtn","langBtn2"].forEach(id=>{ const b=document.getElementById(id); if(b) b.textContent=label; });
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.getElementById("loginHint").innerHTML = t("hintText");
  if(ME){ renderShell(); render(); } else { renderLogin(); }
}

/* ---------- 8. LOGIN ---------- */
function renderLogin(){
  const sel = document.getElementById("lgUser");
  const keep = sel.value;
  sel.innerHTML = DB.users.map(u=>`<option value="${esc(u.id)}">${esc(displayName(u))} — ${esc(t("role"+u.role[0].toUpperCase()+u.role.slice(1)))}</option>`).join("");
  if(keep) sel.value = keep;
  document.getElementById("lgTasks").textContent = DB.tasks.length;
  document.getElementById("lgOpen").textContent = DB.tasks.filter(x=>x.status!=="Completed").length;
  document.getElementById("lgTeam").textContent = DB.users.length;
}
function doLogin(e){
  e.preventDefault();
  const id = document.getElementById("lgUser").value;
  const pw = document.getElementById("lgPass").value;
  const u = DB.users.find(x=>x.id===id);
  const err = document.getElementById("loginErr");
  if(!u || u.pw !== hash(pw)){ err.textContent = t("wrongPw"); err.hidden=false; return; }
  err.hidden = true;
  ME = u;
  sessionStorage.setItem("tms_me", u.id);
  document.getElementById("lgPass").value = "";
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  FILT.mine = (u.role==="member");
  renderShell(); render();
}
function logout(){
  ME=null; sessionStorage.removeItem("tms_me");
  document.getElementById("app").hidden = true;
  document.getElementById("login").hidden = false;
  renderLogin();
}

    `<button class="tab ${TAB===k?"on":""}" onclick="go('${k}')">${esc(t(l))}</button>`).join("");

function go(tab){ TAB=tab; renderShell(); render(); window.scrollTo(0,0); }
function render(){
  const v = document.getElementById("view");
  if(TAB==="dash") v.innerHTML = viewDash();
  else if(TAB==="tasks") v.innerHTML = viewTasks();
  else if(TAB==="ref") v.innerHTML = viewRef();
  else v.innerHTML = viewSettings();
}

function viewDash(){

  const c = s => all.filter(x=>x.status===s).length;
  const overdue = all.filter(isOverdue);
  const people = DB.users.filter(u=>u.isAssignee);
  const counts = people.map(u=>{
    const mine = all.filter(x=>x.assignedTo===u.name);
    return {u, total:mine.length, byStatus:Object.fromEntries(STATUSES.map(s=>[s,mine.filter(x=>x.status===s).length]))};
  });
  const max = Math.max(1, ...counts.map(x=>x.total));

  const kpi = (lblKey,val,color,sub) => `
    <div class="kpi" style="--c:${color}">
      <div class="lbl">${esc(t(lblKey))}</div>
      <div class="val">${val}</div>
      ${sub?`<div class="sub">${esc(sub)}</div>`:""}

  const wl = counts.map(({u,total,byStatus})=>`
    <div class="wl-row">
      <div class="wl-name"><div class="avatar">${esc(initials(u.name))}</div><span>${esc(displayName(u))}</span></div>
      <div class="wl-bar">
        ${STATUSES.filter(s=>byStatus[s]>0).map(s=>{
          const pct = (byStatus[s]/max)*100;
          return `<div class="wl-seg" style="flex:0 0 ${pct}%;background:${STATUS_COLOR[s]}" title="${esc(lbl('status',s))}: ${byStatus[s]}">${pct>5?byStatus[s]:""}</div>`;
        }).join("")}
      </div>
      <div class="wl-total ${total===0?"zero":""}">${total}</div>
    </div>`).join("");

  const nowRows = people.map(u=>{
    const list = all.filter(x=>x.assignedTo===u.name && x.status==="In Progress");
    return `<tr>
      <td style="white-space:nowrap"><div class="wl-name"><div class="avatar">${esc(initials(u.name))}</div><span>${esc(displayName(u))}</span></div></td>
      <td>${list.length ? list.map(x=>`<div style="padding:2px 0"><span class="t-id">T-${String(x.seq).padStart(3,"0")}</span> ${esc(x.description)}${isOverdue(x)?`<span class="badge-late">${esc(t("late"))}</span>`:""}</div>`).join("")
        : `<span style="color:var(--muted)">${esc(t("nothingNow"))}</span>`}</td>
    </tr>`;
  }).join("");

  return `
  <div class="page-head">
    <div><h2>${esc(t("dashTitle"))}</h2><p>${esc(t("dashSub"))}</p></div>
    <div class="grow"></div>
    <button class="btn btn-primary btn-sm" onclick="openTask()">+ ${esc(t("addTask"))}</button>
  </div>

  <div class="kpis">
    ${kpi("kTotal", all.length, "var(--ink)")}
    ${kpi("kNot", c("Not Started"), "var(--s-not)")}
    ${kpi("kProg", c("In Progress"), "var(--s-prog)")}
    ${kpi("kDone", c("Completed"), "var(--s-done)")}
    ${kpi("kOver", overdue.length, "var(--s-late)", t("kOverSub"))}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>${esc(t("workload"))}</h3><span class="note">${esc(t("workloadNote"))}</span></div>
    <div class="card-b">

function filtered(){
  let rows = DB.tasks.slice();
  const q = FILT.q.trim().toLowerCase();
  if(q) rows = rows.filter(x=>(x.description+" "+(x.remarks||"")).toLowerCase().includes(q));
  if(FILT.to) rows = rows.filter(x=>x.assignedTo===FILT.to);
  if(FILT.st) rows = rows.filter(x=>x.status===FILT.st);
  if(FILT.pr) rows = rows.filter(x=>x.priority===FILT.pr);
  if(FILT.ty) rows = rows.filter(x=>x.type===FILT.ty);
  if(FILT.mine && ME) rows = rows.filter(x=>x.assignedTo===ME.name || x.assignedBy===ME.name);
  if(FILT.open) rows = rows.filter(x=>x.status!=="Completed");
  const k = SORT.key, dir = SORT.dir==="asc"?1:-1;
  rows.sort((a,b)=>{
    let va=a[k]??"", vb=b[k]??"";
    if(k==="priority"){ va=PRIORITIES.indexOf(a.priority); vb=PRIORITIES.indexOf(b.priority); }
    if(typeof va==="number"&&typeof vb==="number") return (va-vb)*dir;
    return String(va).localeCompare(String(vb))*dir;
  });
  return rows;
}
function setF(k,v){ FILT[k]=v; render(); }
function sortBy(k){ SORT = {key:k, dir:(SORT.key===k && SORT.dir==="asc")?"desc":"asc"}; render(); }

function syncDue(keep){
  const p = document.getElementById("fPrio").value;
  const da = document.getElementById("fDate").value;
  const due = document.getElementById("fDue");
  const help = document.getElementById("dueHelp");
  const auto = TARGET_DAYS[p] !== null && TARGET_DAYS[p] !== undefined;
  if(auto){
    if(!keep || !due.value) due.value = calcDue(p, da);
    else due.value = calcDue(p, da);
    help.textContent = t("dueAuto");
  } else {
    help.textContent = t("dueManual");
  }
}
function syncDone(){
  const st = document.getElementById("fStatus").value;
  const done = document.getElementById("fDone");
  if(st==="Completed" && !done.value) done.value = todayISO();
  if(st!=="Completed") done.value = "";
}

async function saveTask(id){
  const g = i => document.getElementById(i);
  const desc = g("fDesc").value.trim();
  if(!desc){ g("fDesc").focus(); g("fDesc").style.borderColor="var(--brand)"; return; }
  const existing = id ? DB.tasks.find(x=>x.id===id) : null;
  const task = {
    id: id || ("t_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    seq: existing ? existing.seq : (++DB.seq),
    type: g("fType").value, priority: g("fPrio").value, description: desc,
    assignedBy: g("fBy").value, assignedTo: g("fTo").value,
    dateAssigned: g("fDate").value, timeAssigned: g("fTime").value,
    dueDate: g("fDue").value, completionDate: g("fDone").value,
    status: g("fStatus").value, remarks: g("fRem").value.trim(),
    createdBy: existing ? existing.createdBy : ME.id,
    createdAt: existing ? existing.createdAt : Date.now(),
    updatedAt: Date.now()
  };
  await Store.putTask(task);
  if(!existing) await Store.flush?.();
  closeModal(); render(); toast(t("saved"));
}
async function delTask(id){
  if(!confirm(t("confirmDel"))) return;
  await Store.removeTask(id);
  closeModal(); render(); toast(t("deleted"));
}

/* ---------- 15. EXPORT / IMPORT ---------- */
function exportCSV(){
  const head = ["N","Type","Priority","Description","Assigned By","Assigned To","Date Assigned","Time Assigned","Due Date","Completion Date","Status","Remarks"];
  const rows = filtered().map(x=>[x.seq,x.type,x.priority,x.description,x.assignedBy,x.assignedTo,x.dateAssigned,x.timeAssigned,x.dueDate,x.completionDate,x.status,x.remarks]);
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const csv = "\uFEFF" + [head.map(q).join(","), ...rows.map(r=>r.map(q).join(","))].join("\r\n");
  download(new Blob([csv],{type:"text/csv;charset=utf-8"}), `Task_Management_${todayISO()}.csv`);
}
function exportJSON(){
  download(new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}), `tms_backup_${todayISO()}.json`);
}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const next = JSON.parse(r.result);
      if(!next.users || !next.tasks) throw new Error("shape");
      await Store.replaceAll(next);
      ME = DB.users.find(u=>u.id===ME.id) || DB.users[0];
      render(); toast(t("imported"));
    }catch(e){ toast(t("importBad")); }
    input.value="";
  };
  r.readAsText(f);
}
function download(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ---------- 16. BOOT ---------- */
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

async function boot(){
  /* If firebase-adapter.js is loaded it defines window.RemoteStoreFactory.
     Module scripts run before DOMContentLoaded, so it is ready by now. */
  if(window.RemoteStoreFactory){
    try{
      Store = await window.RemoteStoreFactory({
        getDB:()=>DB, setDB:d=>{DB=d},
        DEFAULT_USERS, DEFAULT_PW, hash, todayISO
      });
      console.info("Task Management: connected to Firebase.");
    }catch(e){
      console.error("Task Management: Firebase unavailable, using this browser's local storage.", e);
      Store = LocalStore;
    }
  }
  await Store.init();
  Store.onChange?.(()=>{ if(ME) render(); else renderLogin(); });
  applyLang();
  const savedId = sessionStorage.getItem("tms_me");
  const u = savedId && DB.users.find(x=>x.id===savedId);
  if(u){
    ME = u;
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    FILT.mine = (u.role==="member");
    renderShell(); render();
  } else {
    renderLogin();
  }
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
